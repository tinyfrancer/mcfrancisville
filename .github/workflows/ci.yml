name: CI

# Actions minutes are metered on a private repo (decision 117), so a draft PR runs nothing: every
# check is run in the container before each push, and CI confirms once the PR is marked ready.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, not three: each job is billed rounded up to the minute and runs its own npm ci.
  check:
    name: gates and smoke (node 22)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Reported, never gated.
      - run: npm run coverage
      - run: npm run build

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        # Always --with-deps: the cache restores the browser, not the system libraries it needs.
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null && exit 0
            sleep 1
          done
          echo "dev server never came up on :5173" >&2
          exit 1

      - run: npm run smoke

      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: .smoke/
          if-no-files-found: ignore
          retention-days: 7

  # 25 catches a Node-version break in the test environment early; the PRs run 22, the LTS floor.
  next-node:
    name: gates (node 25)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
